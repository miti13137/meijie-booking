<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#286257"><title>梅姐家庭理髮｜預約系統</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#263a34;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:16px 14px 45px}header{background:#286257;color:#fff;border-radius:20px;padding:23px 20px}h1{font-size:26px;margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:18px 0 9px}header p{margin:5px 0;font-size:14px}.card{background:white;border-radius:16px;margin-top:14px;padding:18px;box-shadow:0 2px 14px #1b433215}.tabs,.two,.slots,.row{display:flex;gap:9px;flex-wrap:wrap}.tabs>*{flex:1}.two>*{flex:1}.slots button{width:calc(25% - 7px);min-width:0;padding:10px 2px}.row{align-items:center;justify-content:space-between}button,input,select{font:inherit;min-height:46px;padding:11px;border:1px solid #bccfc7;border-radius:11px;background:white;color:#254e43}button{cursor:pointer;font-weight:650}button.active,button.primary{background:#286257;color:white;border-color:#286257}button:disabled{opacity:.38;cursor:not-allowed}input,select{width:100%}label{display:block;font-weight:650;margin:14px 0 6px}.hint{color:#64786e;font-size:13px;line-height:1.6}.warning{background:#fff4e5;color:#8a5709;padding:11px;border-radius:10px}.error{color:#a52b32}.success{color:#17704b}.hidden{display:none!important}.booking{border:1px solid #dbe8e1;padding:13px;border-radius:12px;margin:10px 0}.booking p{margin:6px 0}.pill{font-size:12px;background:#e8f4ee;border-radius:30px;padding:4px 9px;display:inline-block}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{min-height:39px;padding:7px 12px}.wide{width:100%}.count{font-weight:750;color:#a14b14}footer{text-align:center;font-size:12px;color:#6d8077;padding:22px}.switch{display:flex;align-items:center;gap:7px;margin:8px 0}.switch input{width:auto;min-height:auto}button:focus-visible,input:focus-visible{outline:3px solid #8bd0a6} @media(max-width:380px){.slots button{width:calc(33.333% - 6px)}}
</style></head><body><div class="wrap"><header><h1>✂️ 梅姐家庭理髮</h1><p>梅姐／文姐 · 每次 30 分鐘 · 08:00–19:00</p><p>每週四公休｜新竹市東區振興路10號</p></header><section class="card"><div class="tabs"><button id="guestTab" class="active">客人預約</button><button id="adminTab">店家管理 <span id="badge"></span></button></div><p id="modeInfo" class="hint"></p></section>
<main id="guest"><section class="card"><h2>線上預約申請</h2><h3>① 指定設計師</h3><div class="two"><button class="active" data-stylist="梅姐">梅姐</button><button data-stylist="文姐">文姐</button></div><label for="date">② 預約日期</label><input type="date" id="date"><p id="leaveTip" class="warning hidden"></p><button id="switchStylist" class="hidden">改約另一位設計師</button><h3>③ 選擇時間</h3><div class="slots" id="slots"></div><p class="hint" id="slotInfo"></p><label for="name">④ 客人姓名</label><input id="name" maxlength="50" placeholder="請輸入姓名"><label for="phone">手機號碼</label><input id="phone" type="tel" inputmode="tel" placeholder="0912345678"><p class="hint">送出後是「待確認」，需由梅姐或文姐審核後才成立。</p><button class="primary wide" id="submit">送出預約申請</button><p id="guestMsg" role="status"></p></section><section class="card"><h2>查詢我的預約</h2><label>預約編號</label><input id="code" placeholder="送出申請後取得"><label>預約手機號碼</label><input id="lookupPhone" type="tel" inputmode="tel" placeholder="0912345678"><button id="lookup" style="margin-top:12px">查詢預約狀態</button><p id="lookupMsg" role="status"></p></section></main>
<main id="admin" class="hidden"><section class="card"><h2>店家管理後台</h2><div id="loginArea"><p class="hint" id="loginHint">梅姐與文姐各自登入，皆可處理兩人的預約。</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button class="primary wide" id="login" style="margin-top:12px">登入店家管理</button></div><div id="adminArea" class="hidden"><div class="row"><span class="pill">店家管理模式</span><button id="logout">登出</button></div><h3>🔔 待確認預約 <span class="count" id="pendingCount">0</span></h3><div id="pending"></div><h3>指定日期預約</h3><label>查看日期</label><input type="date" id="adminDate"><label>設計師</label><select id="adminFilter"><option value="">全部</option><option>梅姐</option><option>文姐</option></select><button id="refresh" style="margin-top:10px">重新整理</button><div id="bookings"></div><hr style="border:0;border-top:1px solid #e1eae4;margin:22px 0"><h2>🏖️ 請假與休息時段</h2><p class="hint">可設定連續多天出國、單日休假，或指定半小時時段。只影響選定的設計師。</p><label>請假設計師</label><select id="blockStylist"><option>梅姐</option><option>文姐</option></select><label>請假類型</label><select id="blockType"><option value="range">連續日期（出國旅遊）</option><option value="day">單日全天</option><option value="partial">單日指定時段</option></select><label>開始日期</label><input type="date" id="startDate"><div id="endDateBox"><label>結束日期（包含當天）</label><input type="date" id="endDate"></div><div id="timeBox" class="hidden"><div class="two"><div><label>開始時間</label><select id="startTime"></select></div><div><label>結束時間</label><select id="endTime"></select></div></div></div><label>原因（選填）</label><input id="reason" placeholder="例如：出國旅遊"><button class="primary wide" id="saveBlock" style="margin-top:14px">儲存休假／封鎖</button><p id="blockMsg" role="status"></p><h3>已設定休假</h3><div id="blockList"></div></div><p id="adminMsg" role="status"></p></section></main><footer>梅姐家庭理髮 · 預約申請須經店家確認</footer></div>
<script>
'use strict';
// Production: set these two public values, deploy over HTTPS, and run setup.sql. NEVER use a secret/service-role key.
const SUPABASE_URL='https://olnqobgnobzrtriegbdm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_F86-Wz4-GKykT5Pflb7pwA_ZiVJsaB3';
const CLOUD_CONFIGURED=!SUPABASE_URL.startsWith('REPLACE_')&&!SUPABASE_ANON_KEY.startsWith('REPLACE_');
let db=null, cloud=false, adminLogged=false, stylist='梅姐', chosen='', records=[], blocks=[];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, today=fmt(new Date()), dayOf=d=>new Date(d+'T12:00:00').getDay();
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return fmt(x)};
const firstOpen=()=>{let d=addDays(today,1);while(dayOf(d)===4)d=addDays(d,1);return d};
const slots=Array.from({length:22},(_,i)=>`${pad(8+Math.floor(i/2))}:${i%2?'30':'00'}`);
const allTimes=[...slots,'19:00'];
const minute=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5));
const overlap=(t,a,b)=>minute(t)<minute(b)&&minute(t)+30>minute(a);
const currentBlock=(s,d,t)=>blocks.find(b=>b.stylist===s&&d>=b.start_day&&d<=b.end_day&&overlap(t,b.start_time,b.end_time));
const escapeText=v=>String(v??'');
function showMsg(id,v,cls=''){const e=$(id);e.textContent=v;e.className=cls}
function loadDemo(){try{records=JSON.parse(localStorage.getItem('meijie_demo_records')||'[]');blocks=JSON.parse(localStorage.getItem('meijie_demo_blocks')||'[]')}catch(e){records=[];blocks=[]}}
function persist(){if(!cloud){localStorage.setItem('meijie_demo_records',JSON.stringify(records));localStorage.setItem('meijie_demo_blocks',JSON.stringify(blocks))}}
function showTab(isAdmin){$('guest').classList.toggle('hidden',isAdmin);$('admin').classList.toggle('hidden',!isAdmin);$('guestTab').classList.toggle('active',!isAdmin);$('adminTab').classList.toggle('active',isAdmin);if(isAdmin)refreshSession()}
$('guestTab').onclick=()=>showTab(false);$('adminTab').onclick=()=>showTab(true);
$('date').min=today;$('date').value=firstOpen();$('adminDate').value=firstOpen();$('startDate').value=firstOpen();$('endDate').value=addDays(firstOpen(),9);
for(const [id,values] of [['startTime',slots],['endTime',allTimes]]){for(const t of values){const o=document.createElement('option');o.value=t;o.textContent=t;$(id).appendChild(o)}}$('startTime').value='12:00';$('endTime').value='13:00';
function changeStylist(s){stylist=s;document.querySelectorAll('[data-stylist]').forEach(b=>b.classList.toggle('active',b.dataset.stylist===s));loadSlots()}
document.querySelectorAll('[data-stylist]').forEach(b=>b.onclick=()=>changeStylist(b.dataset.stylist));$('switchStylist').onclick=()=>changeStylist(stylist==='梅姐'?'文姐':'梅姐');$('date').onchange=loadSlots;
function renderSlots(times){const box=$('slots');box.replaceChildren();chosen='';for(const t of times){const b=document.createElement('button');b.textContent=t;b.type='button';b.onclick=()=>{chosen=t;box.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));showMsg('guestMsg','')};box.appendChild(b)}}
async function loadSlots(){const d=$('date').value;renderSlots([]);$('leaveTip').classList.add('hidden');$('switchStylist').classList.add('hidden');if(!d)return;if(dayOf(d)===4){showMsg('slotInfo','週四公休，請選其他日期。');return}if(d<today||d>addDays(today,60)){showMsg('slotInfo','只開放未來 60 天內預約。');return}if(cloud){const {data,error}=await db.rpc('available_slots',{p_date:d,p_stylist:stylist});if(error){showMsg('slotInfo','讀取時段失敗：'+error.message,'error');return}renderSlots((data||[]).map(x=>x.slot));if(!data?.length){$('leaveTip').textContent=`${stylist}當天沒有可預約時段，您可以改選另一位設計師。`;$('leaveTip').classList.remove('hidden');$('switchStylist').classList.remove('hidden')}showMsg('slotInfo',`已顯示 ${stylist} 的 ${data?.length||0} 個可申請時段。`);return}
const list=slots.filter(t=>!(d===today&&minute(t)<=new Date().getHours()*60+new Date().getMinutes())&&!records.some(r=>r.stylist===stylist&&r.day===d&&r.slot===t&&['待確認','已確認'].includes(r.status))&&!currentBlock(stylist,d,t));renderSlots(list);
const isLeave=slots.every(t=>!!currentBlock(stylist,d,t));if(isLeave){$('leaveTip').textContent=`${stylist}這天休假，您可以直接改約${stylist==='梅姐'?'文姐':'梅姐'}，已填的客人資料不會清除。`;$('leaveTip').classList.remove('hidden');$('switchStylist').classList.remove('hidden')}
if(!list.length&&!isLeave){$('leaveTip').textContent=`${stylist}當日沒有可預約時段，您可以改選${stylist==='梅姐'?'文姐':'梅姐'}，或更換日期。`;$('leaveTip').classList.remove('hidden');$('switchStylist').classList.remove('hidden')}
showMsg('slotInfo',list.length?`可選 ${list.length} 個時段，點選時間按鈕後送出申請。`:'這天沒有可預約時段，請改選設計師或日期。')}
$('submit').onclick=async()=>{if(CLOUD_CONFIGURED&&!cloud)return showMsg('guestMsg','雲端連線失敗，暫時無法送出預約。','error');const d=$('date').value,n=$('name').value.trim(),ph=$('phone').value.replace(/[\s-]/g,'');if(!chosen)return showMsg('guestMsg','請先選擇預約時間。','error');if(!n||!/^09\d{8}$/.test(ph))return showMsg('guestMsg','請填姓名及正確的 10 碼手機號碼。','error');$('submit').disabled=true;let code;if(cloud){const {data,error}=await db.rpc('request_booking',{p_day:d,p_time:chosen,p_stylist:stylist,p_name:n,p_phone:ph});if(error){$('submit').disabled=false;showMsg('guestMsg','申請失敗：'+error.message,'error');await loadSlots();return}code=data}else{if(records.some(r=>r.day===d&&r.slot===chosen&&r.stylist===stylist&&['待確認','已確認'].includes(r.status))||currentBlock(stylist,d,chosen)){showMsg('guestMsg','該時段已被預約或封鎖，請重新選擇。','error');$('submit').disabled=false;loadSlots();return}code='TEST'+Date.now().toString(36).toUpperCase();records.push({id:code,code,day:d,slot:chosen,stylist,customer_name:n,phone:ph,status:'待確認'});persist();updateBadge()}
$('code').value=code;$('lookupPhone').value=ph;$('name').value='';$('phone').value='';showMsg('guestMsg',`申請已送出！編號：${code}。目前待店家確認，請保存編號。${cloud?'':'（僅本機測試）'}`,'success');await loadSlots();$('submit').disabled=false};
$('lookup').onclick=async()=>{const code=$('code').value.trim().toUpperCase(),ph=$('lookupPhone').value.replace(/[\s-]/g,'');if(cloud){const {data,error}=await db.rpc('lookup_booking',{p_code:code,p_phone:ph});showMsg('lookupMsg',error?'查詢失敗：'+error.message:data?.length?`${data[0].stylist}｜${data[0].day} ${data[0].slot}｜${data[0].status}`:'查無資料，請檢查編號及電話。',error?'error':'success')}else{const r=records.find(x=>x.code===code&&x.phone===ph);showMsg('lookupMsg',r?`${r.stylist}｜${r.day} ${r.slot}｜${r.status}`:'查無資料，請檢查編號及電話。',r?'success':'error')}};
function updateBadge(){const count=records.filter(r=>r.status==='待確認').length;$('badge').textContent=count?`(${count})`:'';$('pendingCount').textContent=count}
async function refreshSession(){if(!cloud&&CLOUD_CONFIGURED){$('loginArea').classList.remove('hidden');$('adminArea').classList.add('hidden');showMsg('adminMsg','雲端連線失敗，店家管理暫時無法使用。','error');return}if(!cloud){$('loginArea').classList.add('hidden');$('adminArea').classList.remove('hidden');adminLogged=true;await refreshAdmin();return}const {data}=await db.auth.getSession();adminLogged=!!data.session;$('loginArea').classList.toggle('hidden',adminLogged);$('adminArea').classList.toggle('hidden',!adminLogged);if(adminLogged)await refreshAdmin()}
$('login').onclick=async()=>{if(!cloud)return;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return showMsg('adminMsg','登入失敗：'+error.message,'error');$('password').value='';showMsg('adminMsg','登入成功','success');refreshSession()};
$('logout').onclick=async()=>{if(cloud){await db.auth.signOut();refreshSession()}else{showTab(false)}};
async function refreshAdmin(){if(cloud){const [a,b,c]=await Promise.all([db.rpc('admin_list_pending'),db.rpc('admin_list_blocks'),db.rpc('admin_list_bookings',{p_day:$('adminDate').value})]);if(a.error||b.error||c.error){showMsg('adminMsg','讀取失敗：'+(a.error||b.error||c.error).message,'error');return}records=[...a.data];blocks=b.data||[];renderBookingList('pending',a.data||[],true);renderBookingList('bookings',(c.data||[]).filter(r=>!$('adminFilter').value||r.stylist===$('adminFilter').value),false);$('pendingCount').textContent=a.data?.length||0;renderBlocks();return}updateBadge();renderBookingList('pending',records.filter(r=>r.status==='待確認').sort((a,b)=>a.day.localeCompare(b.day)||a.slot.localeCompare(b.slot)),true);renderBookingList('bookings',records.filter(r=>r.day===$('adminDate').value&&(!$('adminFilter').value||r.stylist===$('adminFilter').value)).sort((a,b)=>a.slot.localeCompare(b.slot)),false);renderBlocks()}
function renderBookingList(id,items,pending){const host=$(id);host.replaceChildren();if(!items.length){const p=document.createElement('p');p.className='hint';p.textContent=pending?'目前沒有待確認申請。':'此日期沒有預約。';host.appendChild(p);return}for(const r of items){const box=document.createElement('div');box.className='booking';const h=document.createElement('strong');h.textContent=`${r.day||$('adminDate').value} ${r.slot.slice(0,5)} · ${r.stylist} · ${r.customer_name}`;const p=document.createElement('p');p.className='hint';p.textContent=`${r.phone} · ${r.status}`;box.append(h,p);if(r.status==='待確認'||r.status==='已確認'){const acts=document.createElement('div');acts.className='actions';const choices=r.status==='待確認'?[['接受預約','已確認'],['婉拒','已婉拒']]:[['取消預約','已取消']];for(const [label,status] of choices){const btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>changeStatus(r.id,status);acts.appendChild(btn)}box.appendChild(acts)}host.appendChild(box)}}
async function changeStatus(id,status){if(!confirm(`確定將預約改為「${status}」？`))return;if(cloud){const {error}=await db.rpc('admin_set_status',{p_id:id,p_status:status});if(error)return showMsg('adminMsg',error.message,'error')}else{const r=records.find(x=>x.id===id);if(r)r.status=status;persist()}showMsg('adminMsg','已更新：'+status,'success');await refreshAdmin();if(!cloud)loadSlots()}
$('refresh').onclick=refreshAdmin;$('adminDate').onchange=refreshAdmin;$('adminFilter').onchange=refreshAdmin;
$('blockType').onchange=()=>{$('endDateBox').classList.toggle('hidden',$('blockType').value!=='range');$('timeBox').classList.toggle('hidden',$('blockType').value!=='partial')};
$('saveBlock').onclick=async()=>{const s=$('blockStylist').value,type=$('blockType').value,start=$('startDate').value,end=type==='range'?$('endDate').value:start,from=type==='partial'?$('startTime').value:'08:00',to=type==='partial'?$('endTime').value:'19:00',reason=$('reason').value.trim();if(!start||!end||end<start||end>addDays(start,365)||minute(from)>=minute(to)){showMsg('blockMsg','請檢查日期區間及休息時間。','error');return}if(cloud){const {error}=await db.rpc('admin_add_block',{p_stylist:s,p_start:start,p_end:end,p_from:from,p_to:to,p_reason:reason});if(error)return showMsg('blockMsg',error.message,'error')}else{const affected=records.filter(r=>r.stylist===s&&r.day>=start&&r.day<=end&&['待確認','已確認'].includes(r.status)&&overlap(r.slot,from,to));if(affected.length)return showMsg('blockMsg',`已有 ${affected.length} 筆預約，請先聯絡客人並處理預約，再設定休假。`,'error');blocks.push({id:'block'+Date.now(),stylist:s,start_day:start,end_day:end,start_time:from,end_time:to,reason});persist()}showMsg('blockMsg',`已設定 ${s}：${start} 至 ${end} ${from}–${to}`,'success');await refreshAdmin();if(!cloud)loadSlots()};
function renderBlocks(){const host=$('blockList');host.replaceChildren();if(!blocks.length){host.textContent='尚無休假設定。';return}for(const b of blocks){const div=document.createElement('div');div.className='booking';const p=document.createElement('p');p.textContent=`${b.stylist} · ${b.start_day} ～ ${b.end_day} · ${b.start_time.slice(0,5)}–${b.end_time.slice(0,5)} · ${b.reason||'休假'}`;const del=document.createElement('button');del.textContent='刪除休假';del.onclick=()=>deleteBlock(b.id);div.append(p,del);host.appendChild(div)}}
async function deleteBlock(id){if(!confirm('確定刪除此休假封鎖？'))return;if(cloud){const {error}=await db.rpc('admin_delete_block',{p_id:id});if(error)return showMsg('blockMsg',error.message,'error')}else{blocks=blocks.filter(b=>b.id!==id);persist()}await refreshAdmin();if(!cloud)loadSlots()}
async function init(){if(CLOUD_CONFIGURED){try{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);cloud=true}catch(e){showMsg('modeInfo','無法載入雲端服務，已切換為本機測試模式。','error')}}if(!cloud){loadDemo();if(CLOUD_CONFIGURED){showMsg('modeInfo','⚠️ 雲端連線失敗：預約功能暫停，請店家檢查網路與雲端設定。','error');$('submit').disabled=true;}else{showMsg('modeInfo','🧪 本機操作測試：所有按鈕可用，資料只存在這台裝置。尚未上線，請勿輸入真實客人個資。');}$('loginHint').textContent='本機測試模式免登入；正式上線後梅姐與文姐各自以帳號密碼登入。'}else{showMsg('modeInfo','☁️ 雲端連線已設定：客人送出申請後由店家確認。');}updateBadge();await loadSlots();if(cloud)setInterval(async()=>{if(adminLogged&&$('admin').classList.contains('hidden')===false)await refreshAdmin()},30000)}
init();
</script></body></html>
